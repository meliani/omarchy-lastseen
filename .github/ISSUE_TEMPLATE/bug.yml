name: Bug report
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Last Seen, Omarchy and Evolution API versions.
      placeholder: Last Seen 1.0.0, Omarchy 4.x, Evolution API 2.3.7
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Output of `journalctl --user --since "10 min ago" | grep -i lastseen`. Remove tokens and phone numbers.
      render: text
